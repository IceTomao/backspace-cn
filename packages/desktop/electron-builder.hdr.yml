# Experimental Windows HDR runtime. HDR remains opt-in and unaccepted in the
# manifest; actual source/output/codec checks are still mandatory at runtime.
extends: ./electron-builder.yml
win:
  extraResources:
    - from: hdr-runtime
      to: hdr
      filter:
        - '**/*'
        - '!*.h'
        - '!*.pdb'
        - '!capture/**'
