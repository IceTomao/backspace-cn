name: Build Windows Desktop

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64 desktop
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go for native HDR bridge
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache-dependency-path: packages/desktop/native/hdr-bridge/go.sum

      - name: Build experimental native HDR runtime and preserve sources
        run: |
          node experiments/windows-hdr/setup-gpu-tools.mjs
          node experiments/windows-hdr/setup-runtime.mjs encoder
          node experiments/windows-hdr/setup-runtime.mjs player
          node packages/desktop/scripts/build-hdr-native.mjs --assemble-runtime
          node --test experiments/windows-hdr/gpu-guards.test.mjs
          node packages/desktop/scripts/prepare-hdr-release.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @backspace/shared build

      - name: Build desktop TypeScript
        run: pnpm --filter @backspace/desktop build:ts

      - name: Build Windows x64 installer
        working-directory: packages/desktop
        run: pnpm exec electron-builder --config electron-builder.hdr.yml --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload desktop installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backspace-desktop-win-x64-${{ github.sha }}
          path: |
            packages/desktop/dist-electron/Backspace-CN-*-win-x64.exe
            packages/desktop/dist-electron/Backspace-CN-*-HDR-sources.zip
          if-no-files-found: error
          retention-days: 14
