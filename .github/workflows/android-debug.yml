name: Android APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @backspace/shared build
      - run: pnpm --filter @backspace/web typecheck
      - run: pnpm --filter @backspace/web test
      - run: node --test scripts/publish-android-release.test.mjs
      - run: node scripts/check-i18n.mjs
      - run: pnpm --filter @backspace/android build
      - name: Test and assemble debug APK (pull requests only)
        if: github.event_name == 'pull_request'
        working-directory: packages/android/android
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: packages/android/android
        env:
          KEYSTORE_BASE64: ${{ secrets.BACKSPACE_ANDROID_KEYSTORE_BASE64 }}
          BACKSPACE_ANDROID_STORE_PASSWORD: ${{ secrets.BACKSPACE_ANDROID_STORE_PASSWORD }}
          BACKSPACE_ANDROID_KEYSTORE: ${{ runner.temp }}/backspace-release.p12
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$BACKSPACE_ANDROID_STORE_PASSWORD" ]; then
            echo 'Configure BACKSPACE_ANDROID_KEYSTORE_BASE64 and BACKSPACE_ANDROID_STORE_PASSWORD in repository Actions secrets.' >&2
            exit 1
          fi
          umask 077
          trap 'rm -f "$BACKSPACE_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$BACKSPACE_ANDROID_KEYSTORE"
          bash ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - name: Verify release signing identity and APK
        if: github.event_name != 'pull_request'
        run: node scripts/verify-android-apk.mjs
      - name: Check debug packaged web entry
        if: github.event_name == 'pull_request'
        working-directory: packages/android/android
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/public/index.html'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: backspace-android-release-${{ github.sha }}
          path: |
            packages/android/android/app/build/outputs/apk/release/app-release.apk
            packages/android/android/app/build/outputs/apk/release/APK-VERIFICATION.txt
            packages/android/android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: backspace-android-debug-${{ github.sha }}
          path: packages/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android update release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-android-release.mjs
