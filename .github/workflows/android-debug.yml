name: Android debug APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @backspace/shared build
      - run: pnpm --filter @backspace/web typecheck
      - run: pnpm --filter @backspace/web test
      - run: pnpm --filter @backspace/android build
      - name: Test and assemble APK
        working-directory: packages/android/android
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Check packaged web entry
        working-directory: packages/android/android
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/public/index.html'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backspace-android-debug-${{ github.sha }}
          path: packages/android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
