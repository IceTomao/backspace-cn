name: Release Windows Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Validate tag matches desktop version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GH_REPO" != "IceTomao/backspace-cn" ]; then
            echo "::error::This workflow publishes only IceTomao/backspace-cn, not $GH_REPO"
            exit 1
          fi
          version="$(node -p "require('./packages/desktop/package.json').version")"
          expected="v${version}"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Release tag $TAG must equal $expected from packages/desktop/package.json"
            exit 1
          fi

      - name: Create or reuse draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          matches="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.TAG) | [.id, .draft] | @tsv')"
          count="$(printf '%s\n' "$matches" | grep -c $'\t' || true)"
          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases already use tag $TAG. Consolidate them before retrying."
            exit 1
          fi
          if [ "$count" -eq 1 ]; then
            draft="$(printf '%s' "$matches" | cut -f2)"
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already public; refusing to replace published assets."
              exit 1
            fi
            echo "Reusing existing draft release for $TAG; removing stale assets before rebuilding."
            gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                [ -z "$asset" ] || gh release delete-asset "$TAG" "$asset" --repo "$GH_REPO" --yes
              done
            exit 0
          fi

          version="${TAG#v}"
          asset="Backspace-CN-${version}-win-x64.exe"
          notes="$(mktemp)"
          {
            echo "## Windows x64"
            echo
            echo "[Download $asset](https://github.com/$GH_REPO/releases/download/$TAG/$asset)"
            echo
            echo "The blockmap and latest.yml assets are used by the in-app updater."
            notes_file="docs/releases/${version}.md"
            if [ -f "$notes_file" ]; then
              echo
              cat "$notes_file"
            fi
          } > "$notes"
          gh release create "$TAG" --draft --title "Backspace CN $version" --notes-file "$notes"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @backspace/shared build

      - name: Build preload and desktop TypeScript
        run: pnpm --filter @backspace/desktop build:ts

      - name: Build and upload Windows x64 updater assets
        working-directory: packages/desktop
        run: pnpm exec electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Validate updater source and local assets
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="packages/desktop/dist-electron/Backspace-CN-${version}-win-x64.exe"
          for file in "$base" "$base.blockmap" packages/desktop/dist-electron/latest.yml; do
            test -s "$file" || { echo "::error::Missing updater asset: $file"; exit 1; }
          done

          node <<'NODE'
          const fs = require('fs');
          const path = 'packages/desktop/dist-electron/win-unpacked/resources/app-update.yml';
          if (!fs.existsSync(path)) throw new Error(`Missing ${path}`);
          const text = fs.readFileSync(path, 'utf8');
          for (const [key, value] of Object.entries({ provider: 'github', owner: 'IceTomao', repo: 'backspace-cn' })) {
            if (!new RegExp(`^${key}:\\s*["']?${value}["']?\\s*$`, 'm').test(text)) {
              throw new Error(`${path} does not contain ${key}: ${value}`);
            }
          }
          const latest = fs.readFileSync('packages/desktop/dist-electron/latest.yml', 'utf8');
          const version = require('./packages/desktop/package.json').version;
          const installer = `Backspace-CN-${version}-win-x64.exe`;
          if (!latest.includes(`version: ${version}`) || !latest.includes(installer)) {
            throw new Error('latest.yml does not describe the expected Windows x64 installer');
          }
          const config = fs.readFileSync('packages/desktop/dist/buildConfig.js', 'utf8');
          if (!config.includes('updatesEnabled: true')) throw new Error('Packaged distribution still disables updates');
          NODE

      - name: Verify Electron security fuses
        shell: pwsh
        working-directory: packages/desktop
        run: |
          $output = pnpm exec electron-fuses read --app dist-electron/win-unpacked/Backspace.exe 2>&1 | Out-String
          $output
          foreach ($expected in @(
            'RunAsNode is Disabled',
            'EnableNodeCliInspectArguments is Disabled',
            'OnlyLoadAppFromAsar is Enabled'
          )) {
            if (-not $output.Contains($expected)) {
              throw "Electron fuse verification failed: missing '$expected'"
            }
          }

      - name: Validate uploaded assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          expected="$(printf '%s\n' "Backspace-CN-${version}-win-x64.exe" "Backspace-CN-${version}-win-x64.exe.blockmap" "latest.yml" | sort)"
          actual="$(gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release assets do not match the updater contract."
            echo "Expected:"; printf '%s\n' "$expected"
            echo "Actual:"; printf '%s\n' "$actual"
            exit 1
          fi
          draft="$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)"
          test "$draft" = "true" || { echo "::error::Release became public before validation"; exit 1; }

      - name: Publish validated release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GH_REPO" --draft=false --latest
